<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1024 1024" style="display:block">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11566B"/>
      <stop offset="1" stop-color="#262F7E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.52" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2E8296" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2E8296" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx="0.42" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#F9D478"/>
      <stop offset="1" stop-color="#E9A63A"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- 星点装饰 -->
  <g fill="#FFE9A8" opacity="0.5">
    <path d="M838 232 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z"/>
    <circle cx="880" cy="700" r="7"/>
    <circle cx="170" cy="880" r="6" opacity="0.7"/>
  </g>

  <g transform="translate(48,55)">
    <!-- 声波（从耳际散出） -->
    <g stroke="#FFD97D" fill="none" stroke-linecap="round">
      <path d="M276 234 A 70 70 0 0 0 276 366" stroke-width="14" opacity="0.95"/>
      <path d="M262 197 A 110 110 0 0 0 262 403" stroke-width="12" opacity="0.8"/>
      <path d="M245 150 A 160 160 0 0 0 245 450" stroke-width="9" opacity="0.55"/>
    </g>

    <!-- 字幕条 -->
    <rect x="130" y="545" width="140" height="26" rx="13" fill="#FBEFD4" opacity="0.95"/>
    <rect x="130" y="598" width="95" height="26" rx="13" fill="#FFD97D" opacity="0.8"/>

    <!-- 耳 -->
    <path d="M350 400 C 300 335 285 255 315 190 C 372 220 425 280 445 360 Z" fill="#DE9A33"/>
    <path d="M362 375 C 330 325 318 265 335 220 C 370 245 405 295 420 345 Z" fill="#FBEFD4" opacity="0.9"/>

    <!-- 独角 -->
    <path d="M548 352 C 534 280 536 212 562 168 C 590 224 612 290 622 350 Z" fill="#FCF3DD" stroke="#E8CE96" stroke-width="3"/>

    <!-- 头 -->
    <circle cx="505" cy="530" r="200" fill="url(#face)"/>

    <!-- 下巴绒毛 -->
    <g fill="#FBEFD4">
      <circle cx="405" cy="698" r="34"/>
      <circle cx="465" cy="710" r="38"/>
      <circle cx="525" cy="698" r="34"/>
    </g>

    <!-- 口鼻 -->
    <ellipse cx="655" cy="598" rx="115" ry="80" fill="#FDF3DC"/>
    <ellipse cx="748" cy="560" rx="23" ry="18" fill="#6B4423"/>
    <path d="M715 636 Q 675 662 628 650" stroke="#6B4423" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- 闭目凝听 -->
    <path d="M468 500 Q 503 530 540 502" stroke="#4A2E14" stroke-width="11" fill="none" stroke-linecap="round"/>

    <!-- 腮红 -->
    <ellipse cx="415" cy="612" rx="34" ry="20" fill="#F2A76B" opacity="0.5"/>
  </g>
</svg>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>谛听 Diting · 会议录音转文字</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233ddc97' stroke-width='2'%3E%3Cpath d='M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z'/%3E%3Cpath d='M19 10v2a7 7 0 0 1-14 0v-2'/%3E%3Cline x1='12' x2='12' y1='19' y2='22'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0b0e0d; --card:#12161a; --card2:#181d22; --card3:#1f262d; --line:#252d33;
    --fg:#e9edf1; --dim:#8d97a3; --dim2:#5e6a76;
    --jade:#3ddc97; --jade2:#2bb67d; --gold:#e2c07a;
    --blue:#7cb8ff; --red:#ff6b6b; --amber:#f5c451;
    --pink:#f778ba; --purple:#c792ea; --orange:#ffa657;
  }
  * { box-sizing:border-box; margin:0; }
  ::selection { background:rgba(61,220,151,.25); }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#28313a; border-radius:5px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track { background:transparent; }
  .ic { width:1em; height:1em; stroke:currentColor; stroke-width:2; fill:none;
        stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.12em; }
  body {
    background:
      radial-gradient(900px 420px at 80% -10%, rgba(61,220,151,.07), transparent 60%),
      radial-gradient(700px 380px at -5% 105%, rgba(226,192,122,.05), transparent 55%),
      var(--bg);
    color:var(--fg); font-family:"Microsoft YaHei UI",system-ui,sans-serif; height:100vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header {
    height:60px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 22px;
    background:rgba(11,14,13,.75); border-bottom:1px solid var(--line); backdrop-filter:blur(12px);
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .mark {
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#1c2a24,#10161a); border:1px solid rgba(61,220,151,.35);
    color:var(--jade); font-size:17px;
  }
  .brand b { font-size:19px; letter-spacing:2px;
             background:linear-gradient(90deg,#e9edf1,#b9c4bd); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand em { color:var(--gold); font-style:normal; font-size:11px; font-weight:700; letter-spacing:3px; }
  #phase { padding:4px 13px; border-radius:20px; font-size:12.5px; background:var(--card2); color:var(--dim); }
  #phase.rec { background:rgba(255,107,107,.1); color:var(--red); border:1px solid rgba(255,107,107,.25); }
  #phase.trx { background:rgba(245,196,81,.08); color:var(--amber); border:1px solid rgba(245,196,81,.2); }
  #elapsed { font-size:21px; font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:2px; }
  #detail { color:var(--dim2); font-size:12px; }
  header .sp { flex:1; }
  .hbtn {
    display:inline-flex; align-items:center; gap:7px; background:var(--card2); color:var(--fg);
    border:1px solid var(--line); border-radius:10px; padding:8px 15px; cursor:pointer; font-size:13px;
  }
  .hbtn .ic { color:var(--jade); }
  .hbtn:hover { border-color:rgba(61,220,151,.5); }
  /* ---------- 布局 ---------- */
  .wrap { flex:1; display:flex; min-height:0; }
  aside {
    width:250px; flex-shrink:0; padding:14px 12px; display:flex; flex-direction:column; gap:8px;
    background:rgba(13,17,16,.55); border-right:1px solid var(--line);
  }
  aside h2 { font-size:11.5px; color:var(--dim); font-weight:normal; padding:0 6px 2px;
             display:flex; justify-content:space-between; align-items:center; letter-spacing:1px; }
  .seg { display:flex; background:var(--card2); border-radius:9px; padding:3px; gap:3px; }
  .seg button { flex:1; border:0; background:transparent; color:var(--dim); font-size:12px;
                padding:6px 0; border-radius:7px; cursor:pointer; }
  .seg button.on { background:var(--card3); color:var(--jade); }
  #recList { overflow-y:auto; flex:1; margin-top:4px; }
  .recItem { position:relative; padding:10px 68px 10px 13px; border-radius:10px; cursor:pointer;
             font-size:13px; margin-bottom:3px; border:1px solid transparent; }
  .recItem:hover { background:var(--card2); }
  .recItem.on { background:var(--card2); border-color:rgba(61,220,151,.25); }
  .recItem.on::before { content:''; position:absolute; left:-1px; top:10px; bottom:10px; width:3px;
                        border-radius:2px; background:var(--jade); }
  .recItem small { display:block; color:var(--dim2); font-size:11px; margin-top:2px; }
  .recAct { position:absolute; right:9px; top:50%; transform:translateY(-50%); display:none; gap:8px; }
  .recItem:hover .recAct { display:flex; }
  .recAct a { cursor:pointer; font-size:11px; color:var(--dim); user-select:none; }
  .recAct a:hover { color:var(--blue); } .recAct a.del:hover { color:var(--red); }
  main { flex:1; overflow-y:auto; padding:22px 26px 34px; display:flex; flex-direction:column; gap:16px; }
  .card {
    background:linear-gradient(180deg,#151a20,#11151a); border:1px solid var(--line); border-radius:16px;
    padding:20px 22px; box-shadow:0 12px 34px rgba(0,0,0,.28);
  }
  .card h4 { font-size:11.5px; color:var(--dim); font-weight:normal; margin-bottom:12px; letter-spacing:2.5px; }
  /* ---------- 控制卡 ---------- */
  .ctrl { display:flex; align-items:center; gap:26px; }
  #btnStart {
    width:84px; height:84px; border-radius:50%; border:0; cursor:pointer; position:relative; flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #46e6a1, #17a058 72%); color:#06130b;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    box-shadow:0 6px 30px rgba(61,220,151,.3), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .12s;
  }
  #btnStart .ic { width:26px; height:26px; }
  #btnStart .lb { font-size:11.5px; font-weight:700; letter-spacing:1px; }
  #btnStart:active { transform:scale(.93); }
  #btnStart.stop {
    background:radial-gradient(circle at 32% 28%, #ff8a8a, #e03e43 72%); color:#fff;
    box-shadow:0 6px 30px rgba(224,62,67,.35), inset 0 1px 0 rgba(255,255,255,.3);
  }
  #btnStart.stop .ic { width:20px; height:20px; }
  #btnStart.stop .ic rect { fill:#fff; stroke:none; }
  #btnStart.stop::before, #btnStart.stop::after {
    content:''; position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(255,107,107,.45); animation:ripple 1.8s ease-out infinite;
  }
  #btnStart.stop::after { animation-delay:.9s; }
  #btnStart:disabled { background:var(--card3); color:var(--dim); box-shadow:none; cursor:wait; }
  #btnStart:disabled::before, #btnStart:disabled::after { display:none; }
  @keyframes ripple { 0% { transform:scale(1); opacity:.8; } 100% { transform:scale(1.5); opacity:0; } }
  .ctrl .meta { display:flex; flex-direction:column; gap:6px; }
  #elapsed { font-size:34px; font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:3px; line-height:1; }
  #detail { color:var(--dim); font-size:12.5px; display:flex; align-items:center; gap:6px; }
  .levels { margin-left:auto; display:flex; flex-direction:column; gap:11px; }
  .lv { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--dim); }
  .bar { width:135px; height:6px; background:var(--card3); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:3px;
           background:linear-gradient(90deg,var(--jade2),var(--jade)); transition:width .18s; }
  /* ---------- 实时字幕剧场 ---------- */
  #liveCard { position:relative; overflow:hidden; }
  #liveCard::before { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(600px 200px at 50% 0%, rgba(61,220,151,.06), transparent 70%); }
  #live { min-height:150px; max-height:300px; overflow-y:auto; font-size:16.5px; line-height:2;
          display:flex; flex-direction:column; gap:2px; }
  #live .final { color:var(--dim); }
  #live .final:last-child { color:var(--fg); }
  #live .final .ts { color:var(--dim2); font-size:12px; margin-right:10px; font-variant-numeric:tabular-nums; }
  #live .final .tk { color:var(--dim2); font-size:12px; margin-right:10px; }
  #partial { color:var(--jade); font-size:19px; min-height:1.9em; line-height:1.9; }
  #partial::after { content:'▍'; animation:blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #progress { color:var(--gold); font-size:13px; min-height:1.4em; margin-top:8px; }
  /* ---------- 文稿 ---------- */
  .tabs { display:flex; gap:4px; background:var(--card2); border-radius:10px; padding:3px; width:max-content; }
  .tabs button { border:0; background:transparent; color:var(--dim); font-size:13px; padding:6px 18px;
                 border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .tabs button .ic { width:14px; height:14px; }
  .tabs button.on { background:var(--card3); color:var(--jade); }
  #doc, #docMin { line-height:2.1; font-size:15px; }
  #doc h3, #docMin h3 { margin:16px 0 6px; color:var(--jade); font-size:15px; }
  #doc .ts, #docMin .ts { display:inline-block; color:var(--dim); background:var(--card2); border-radius:5px;
             padding:0 7px; font-size:11.5px; margin-right:9px; font-variant-numeric:tabular-nums; }
  .spkBadge { display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:9px; margin-right:9px; }
  .spk1 { color:#79c0ff; background:rgba(121,184,255,.12); }
  .spk2 { color:#f778ba; background:rgba(247,120,186,.12); }
  .spk3 { color:#ffa657; background:rgba(255,166,87,.12); }
  .spk4 { color:#c792ea; background:rgba(199,146,234,.12); }
  .spk5 { color:#7ee787; background:rgba(126,231,135,.12); }
  #doc hr, #docMin hr { border:0; border-top:1px dashed var(--line); margin:18px 0; }
  #doc:empty::after { content:'从左侧选择一场录音，或开始一场新的录音'; color:var(--dim2); font-size:13.5px; }
  /* ---------- 设置 ---------- */
  details { background:linear-gradient(180deg,#151a20,#11151a); border:1px solid var(--line);
            border-radius:16px; padding:4px 22px; box-shadow:0 12px 34px rgba(0,0,0,.28); }
  details[open] { padding-bottom:18px; }
  summary { cursor:pointer; color:var(--dim); font-size:14px; line-height:3.1; display:flex;
            align-items:center; gap:8px; }
  summary .ic { color:var(--gold); }
  details h5 { font-size:12.5px; color:var(--dim); margin:16px 0 6px; font-weight:normal; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 26px; }
  textarea { width:100%; height:110px; background:var(--bg); color:var(--fg); border:1px solid var(--line);
             border-radius:10px; padding:10px; font-family:inherit; font-size:13px; margin:6px 0; resize:vertical; }
  input, select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:9px;
                  padding:8px 11px; font-size:13px; width:100%; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:rgba(61,220,151,.55); }
  .frow { display:flex; gap:12px; margin:9px 0; align-items:center; }
  .frow label { width:76px; color:var(--dim); font-size:13px; flex-shrink:0; }
  .frow .chk { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--fg); }
  .frow .chk input { width:auto; }
  button.save { background:linear-gradient(145deg,var(--jade),var(--jade2)); color:#07130c; border:0;
                border-radius:9px; padding:7px 18px; cursor:pointer; font-size:13px; font-weight:600; }
  button.save:hover { filter:brightness(1.08); }
  button.ghost { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:9px;
                 padding:6px 16px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  button.ghost:hover { border-color:var(--blue); color:var(--blue); }
  /* ---------- 弹窗/提示 ---------- */
  #qrModal { position:fixed; inset:0; background:rgba(4,6,5,.66); backdrop-filter:blur(4px); z-index:50; }
  #qrModal .panel { background:var(--card); border:1px solid var(--line); border-radius:18px;
                    max-width:430px; margin:8vh auto; padding:22px 24px;
                    box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .toast { position:fixed; top:72px; right:22px; background:var(--card3); border:1px solid var(--line);
           padding:11px 20px; border-radius:12px; display:none; z-index:60; font-size:13.5px;
           box-shadow:0 10px 34px rgba(0,0,0,.45); }
  /* ---------- 手机 ---------- */
  @media (max-width: 760px) {
    body { overflow:auto; height:auto; }
    header { position:sticky; top:0; z-index:10; }
    .wrap { flex-direction:column; }
    aside { width:100%; max-height:190px; border-right:0; border-bottom:1px solid var(--line); }
    main { padding:12px; }
    .levels, #detail { display:none; }
    .grid2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></span>
    <b>谛听</b><em>DITING</em>
  </div>
  <span id="phase">未录音</span>
  <span id="elapsed" style="display:none;">00:00</span>
  <span id="detail"></span>
  <span class="sp"></span>
  <button class="hbtn" id="btnQr" onclick="openQr()"><svg class="ic" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>手机端</button>
</header>

<div class="wrap">
  <aside>
    <div class="seg">
      <button id="segActive" class="on" onclick="switchView(false)">录音</button>
      <button id="segArch" onclick="switchView(true)">归档夹</button>
    </div>
    <div id="recList"></div>
  </aside>

  <main>
    <div class="card ctrl">
      <button id="btnStart"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg><span class="lb">开始</span></button>
      <div class="meta">
        <div id="detail" style="margin:0;"></div>
      </div>
      <div class="levels">
        <div class="lv">系统声 <div class="bar"><i id="lv-sys"></i></div></div>
        <div class="lv">麦克风 <div class="bar"><i id="lv-mic"></i></div></div>
      </div>
    </div>

    <div class="card" id="liveCard">
      <h4>实时字幕 · LIVE</h4>
      <div id="live"></div>
      <div id="partial"></div>
      <div id="progress"></div>
    </div>

    <div class="card" id="docCard" style="display:none;">
      <div class="row" style="justify-content:space-between; margin-bottom:10px;">
        <div class="tabs">
          <button id="tabDoc" class="on" onclick="docTab('doc')"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>文稿</button>
          <button id="tabMin" onclick="docTab('min')"><svg class="ic" viewBox="0 0 24 24"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>会议纪要</button>
        </div>
        <div class="row" style="gap:8px;">
          <button class="ghost" id="btnSrt"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>SRT</button>
          <button class="ghost" id="btnDocx"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>Word</button>
        </div>
      </div>
      <div id="doc"></div>
      <div id="docMin" style="display:none;"></div>
    </div>

    <details>
      <summary><svg class="ic" viewBox="0 0 24 24"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>设置 · 热词 / 纪要接口 / 安全</summary>
      <div class="grid2">
        <div>
          <h5>热词表 —— 一行一个，# 注释。专有名词、人名、产品名</h5>
          <textarea id="hotwords"></textarea>
          <button class="save" onclick="saveHotwords()">保存热词</button>
        </div>
        <div>
          <h5>纪要接口（OpenAI 兼容 / Anthropic；api_base 留空 = 模拟模式）</h5>
          <div class="frow"><label>api_base</label><input id="cfg-base" placeholder="https://xx/v1"></div>
          <div class="frow"><label>api_key</label><input id="cfg-key" type="password" placeholder="留空则不修改"></div>
          <div class="frow"><label>model</label><input id="cfg-model" placeholder="qwen-plus"></div>
          <div class="frow"><label>接口格式</label>
            <select id="cfg-format">
              <option value="openai">OpenAI (/chat/completions)</option>
              <option value="anthropic">Anthropic (/v1/messages)</option>
            </select>
          </div>
          <button class="save" onclick="saveConfig()">保存接口配置</button>
          <h5>信任栅栏 —— 写操作永远仅限本机/白名单</h5>
          <div class="frow"><label>局域网</label>
            <label class="chk"><input type="checkbox" id="cfg-lan"> 允许局域网设备查看字幕与文稿</label>
          </div>
          <div class="frow"><label>白名单</label><input id="cfg-admin" placeholder="额外可写操作的内网 IP，逗号分隔"></div>
          <button class="save" onclick="saveFence()">保存安全设置</button>
        </div>
      </div>
    </details>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="qrModal" style="display:none;" onclick="closeQr(event)">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <b style="display:flex;align-items:center;gap:8px;"><svg class="ic" viewBox="0 0 24 24" style="color:var(--jade);"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>手机端查看</b>
      <a href="javascript:closeQr()" style="color:var(--dim);text-decoration:none;font-size:18px;"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
    </div>
    <div id="qrStatus" style="color:var(--dim);font-size:13px;margin:6px 0;">加载中…</div>
    <div id="qrBox" style="background:#fff;border-radius:14px;padding:10px;width:244px;margin:10px auto;text-align:center;">
      <img id="qrImg" alt="二维码" style="width:224px;height:224px;display:block;">
    </div>
    <div id="qrUrl" style="font-size:14px;color:var(--blue);text-align:center;word-break:break-all;margin:8px 0 12px;"></div>
    <div class="row" style="justify-content:center;gap:10px;">
      <button class="save" onclick="refreshQr()">刷新二维码</button>
      <button class="ghost" onclick="copyLink()"><svg class="ic" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>复制链接</button>
    </div>
    <div id="qrLan" style="margin-top:14px;font-size:12.5px;color:var(--dim);"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const ICON_MIC = '<svg class="ic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>';
const ICON_STOP = '<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>';
let phase = 'idle', ws, timer, archView = false;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2500); }
function fmt(s){ s=Math.floor(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function setPhase(p, detail, elapsed){
  phase = p;
  const b = $('phase');
  b.className = (p==='recording'?'rec':p==='transcribing'||p==='loading'?'trx':'');
  b.id = 'phase';
  b.textContent = {idle:'未录音', loading:'准备中', recording:'录音中', transcribing:'精转中'}[p] || p;
  const btn = $('btnStart');
  btn.innerHTML = (p==='recording')
    ? ICON_STOP + '<span class="lb">停止</span>'
    : ICON_MIC + '<span class="lb">开始</span>';
  btn.classList.toggle('stop', p==='recording');
  btn.disabled = (p==='loading'||p==='transcribing');
  $('detail').innerHTML = detail ? '· ' + detail : '';
  const el = $('elapsed');
  clearInterval(timer);
  if (p==='recording') { el.style.display='';
    el.textContent = fmt(elapsed||0);
    let base = elapsed||0, t0 = Date.now();
    timer = setInterval(()=> el.textContent = fmt(base + (Date.now()-t0)/1000), 500);
  } else { el.style.display='none'; }
  if (p==='idle') { $('lv-sys').style.width = 0; $('lv-mic').style.width = 0; }
}

function addFinal(track, ts, text){
  const div = document.createElement('div'); div.className='final';
  div.innerHTML = `<span class="ts">${ts}</span><span class="tk">${track}</span>${text}`;
  const live = $('live'); live.appendChild(div);
  while (live.children.length > 60) live.firstChild.remove();
  live.scrollTop = live.scrollHeight;
}

function switchView(arch){
  archView = arch;
  $('segActive').classList.toggle('on', !arch);
  $('segArch').classList.toggle('on', arch);
  loadRecordings();
}

function loadRecordings(){
  fetch('/api/recordings'+(archView ? '?view=archive' : '')).then(r=>r.json()).then(list=>{
    const rl = $('recList'); rl.innerHTML = '';
    if (!list.length) {
      rl.innerHTML = `<div style="color:var(--dim2);font-size:12px;padding:8px 12px;">${archView?'归档夹为空':'暂无录音'}</div>`;
      return;
    }
    list.forEach(r=>{
      const d = document.createElement('div');
      d.className='recItem'; d.innerHTML = `${r.name}<small>${r.mtime}</small>`;
      const act = document.createElement('span'); act.className='recAct';
      const bArc = document.createElement('a');
      bArc.textContent = archView ? '还原' : '归档';
      bArc.onclick = e=>{ e.stopPropagation(); doArchive(r.name, !archView); };
      const bDel = document.createElement('a'); bDel.className='del'; bDel.textContent = '删除';
      bDel.onclick = e=>{ e.stopPropagation(); doDelete(r); };
      act.append(bArc, bDel); d.appendChild(act);
      d.onclick = ()=>{ document.querySelectorAll('.recItem').forEach(x=>x.classList.remove('on'));
        d.classList.add('on'); loadTranscript(r.md, r.name); };
      rl.appendChild(d);
    });
  });
}

function doArchive(name, toArchive){
  fetch('/api/archive',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name, undo:!toArchive})}).then(r=>r.json()).then(d=>{
    if (d.ok) { toast(toArchive ? '已归档' : '已还原'); loadRecordings(); }
    else toast('失败: '+(d.error||'')); });
}
function doDelete(r){
  if (!confirm(`永久删除 ${r.name} 的录音与文稿？不可恢复`)) return;
  fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:r.name})}).then(x=>x.json()).then(d=>{
    if (d.ok) { toast('已删除');
      if (curMdFile && curMdFile.startsWith(r.name)) $('docCard').style.display='none';
      loadRecordings(); }
    else toast('失败: '+(d.error||'')); });
}

const SPK_COLORS = 5;
function spkBadge(tag){
  const n = parseInt((tag.match(/(\d+)/)||[0,1])[1], 10);
  return `<span class="spkBadge spk${((n-1) % SPK_COLORS) + 1}">${tag}</span>`;
}

let docParts = {doc:[], min:[]};
function renderMd(md){
  docParts = {doc:[], min:[]};
  let inMinutes = false;
  md.split('\n').forEach(line=>{
    const l = line.trim();
    if (l.startsWith('# 会议纪要')) { inMinutes = true; docParts.min.push('<hr>');
      docParts.min.push('<h3>会议纪要</h3>'); return; }
    if (l.startsWith('## ')) {
      const h = `<h3>${l.slice(3)}</h3>`;
      (inMinutes ? docParts.min : docParts.doc).push(h); return;
    }
    if (l.startsWith('# ') || !l) return;
    if (l.startsWith('---')) { (inMinutes ? docParts.min : docParts.doc).push('<hr>'); return; }
    const m = l.match(/^\[(\d{2}:\d{2})\](\[(说话人\d+)\])?\s*(.*)$/);
    let html = null;
    if (m && !inMinutes) {
      const spk = m[3] ? spkBadge(m[3]) : '';
      html = `<span class="ts">${m[1]}</span>${spk}${m[4]}`;
    }
    (inMinutes ? docParts.min : docParts.doc).push(html !== null ? `<div>${html}</div>` : `<div>${l}</div>`);
  });
  $('doc').innerHTML = docParts.doc.join('') || '<div style="color:var(--dim2)">（无转写内容）</div>';
  $('docMin').innerHTML = docParts.min.join('') || '<div style="color:var(--dim2)">（尚未生成纪要）</div>';
  docTab(hasMin() ? 'min' : 'doc');
  $('docCard').style.display = 'block';
}
function hasMin(){ return docParts.min.some(x => x !== '<hr>' && !x.startsWith('<h3>')); }
function docTab(which){
  $('tabDoc').classList.toggle('on', which==='doc');
  $('tabMin').classList.toggle('on', which==='min');
  $('doc').style.display = which==='doc' ? '' : 'none';
  $('docMin').style.display = which==='min' ? '' : 'none';
}

let curMdFile = null;
function setCurrentDoc(file, name){
  curMdFile = file;
  $('docCard').style.display = 'block';
}
function loadTranscript(file, name){
  fetch('/api/transcript?name='+encodeURIComponent(file)).then(r=>r.json())
    .then(d=>{ setCurrentDoc(file, name); renderMd(d.md); });
}
$('btnSrt').onclick = ()=> curMdFile && window.open('/api/export?name='+encodeURIComponent(curMdFile)+'&fmt=srt');
$('btnDocx').onclick = ()=> curMdFile && window.open('/api/export?name='+encodeURIComponent(curMdFile)+'&fmt=docx');

function saveHotwords(){
  fetch('/api/hotwords',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:$('hotwords').value})}).then(()=>toast('热词已保存'));
}
function saveConfig(){
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({api_base:$('cfg-base').value, api_key:$('cfg-key').value,
      model:$('cfg-model').value, api_format:$('cfg-format').value})})
    .then(()=>toast('接口配置已保存'));
}
let qrTimer = null;
function openQr(){
  $('qrModal').style.display = 'block';
  refreshQr();
  qrTimer = setInterval(pollLan, 3000);
  pollLan();
}
function closeQr(e){
  if (e && e.target && e.target.id !== 'qrModal' && e.target.textContent !== '✕') return;
  $('qrModal').style.display = 'none';
  clearInterval(qrTimer);
}
function refreshQr(){
  $('qrImg').src = '/api/qr.svg?t=' + Date.now();
  pollLan();
}
function copyLink(){
  const url = $('qrUrl').textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(()=>toast('链接已复制')).catch(()=>{});
}
function pollLan(){
  fetch('/api/qr-info').then(r=>r.json()).then(d=>{
    $('qrUrl').textContent = d.url || '';
    if (!d.lan_on) {
      $('qrStatus').innerHTML = '局域网访问未开启';
      $('qrLan').innerHTML = '<button class="save" onclick="enableLan()">一键开启局域网并重启服务</button>' +
        '<div style="margin-top:6px;color:var(--dim);">开启后手机连同一 WiFi 即可访问；写操作仍仅限本机。</div>';
      $('qrBox').style.opacity = .25;
      return;
    }
    $('qrBox').style.opacity = 1;
    $('qrStatus').innerHTML = d.phone.fresh
      ? '<span style="color:var(--jade);">● 手机已连接</span>（' + (d.phone.ip||'') + '）'
      : '等待手机连接… 用手机相机扫码，或在手机浏览器打开下方链接。';
    $('qrLan').textContent = '局域网访问已开启（' + (d.ips||[]).join(' / ') + '）· 写操作仅限本机/白名单';
  });
}
function enableLan(){
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lan_access:true})}).then(()=>{
    toast('正在重启服务…');
    fetch('/api/restart',{method:'POST'}).then(()=>{
      $('qrStatus').textContent = '服务重启中，几秒后自动恢复…';
      const wait = setInterval(()=>{
        fetch('/api/status').then(r=>{ if(r.ok){ clearInterval(wait); location.reload(); } }).catch(()=>{});
      }, 1500);
    });
  });
}

function saveFence(){
  const admins = $('cfg-admin').value.split(/[,，\s]+/).filter(x=>x);
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lan_access:$('cfg-lan').checked, admin_hosts:admins})})
    .then(()=>toast('已保存。局域网开关需重启服务生效'));
}

$('btnStart').onclick = ()=>{
  if (phase==='recording') {
    fetch('/api/stop',{method:'POST'});
  } else if (phase==='idle') {
    $('live').innerHTML=''; $('partial').textContent=''; $('progress').textContent='';
    fetch('/api/start',{method:'POST'}).then(r=>r.json()).then(d=>{
      if(!d.ok) toast('启动失败: '+d.error);
    });
  }
};

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ev=>{
    const m = JSON.parse(ev.data);
    if (m.type==='status') setPhase(m.phase, m.detail, m.elapsed);
    else if (m.type==='partial') $('partial').textContent = m.text ? `▶ ${m.track}｜${m.text}` : '';
    else if (m.type==='final') { $('partial').textContent=''; addFinal(m.track, m.ts, m.text); }
    else if (m.type==='level') { $('lv-sys').style.width = (m['系统']||0)*100+'%';
                                 $('lv-mic').style.width = (m['麦克风']||0)*100+'%'; }
    else if (m.type==='progress') $('progress').textContent = m.msg;
    else if (m.type==='transcript') { $('progress').textContent=''; setCurrentDoc(m.name, m.name);
                                      renderMd(m.md); }
    else if (m.type==='recordings') loadRecordings();
  };
  ws.onclose = ()=> setTimeout(connect, 1500);
}

fetch('/api/status').then(r=>r.json()).then(s=> setPhase(s.phase, s.detail, s.elapsed));
fetch('/api/hotwords').then(r=>r.json()).then(d=> $('hotwords').value = d.text||'');
fetch('/api/config').then(r=>r.json()).then(d=>{ $('cfg-base').value=d.api_base||'';
  $('cfg-model').value=d.model||''; $('cfg-format').value=d.api_format||'openai';
  $('cfg-lan').checked = !!d.lan_access; $('cfg-admin').value=(d.admin_hosts||[]).join(',');
  $('cfg-key').placeholder=d.api_key?'已设置(留空不修改)':'留空则不修改'; });
loadRecordings();
connect();
</script>
</body>
</html>

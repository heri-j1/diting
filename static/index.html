<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>谛听 Diting · 会议录音转文字</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎙️%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0b0d11; --card:#141821; --card2:#1c212c; --card3:#232a37; --line:#242b37;
    --fg:#e7eaf0; --dim:#8a93a3; --dim2:#5c6575;
    --green:#4ade80; --green2:#22c55e; --blue:#7cb8ff; --red:#ff6b6b;
    --amber:#f5c451; --pink:#f778ba; --purple:#c792ea; --orange:#ffa657;
  }
  * { box-sizing:border-box; margin:0; }
  ::selection { background:rgba(74,222,128,.25); }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#2a3240; border-radius:5px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track { background:transparent; }
  body {
    background: radial-gradient(1100px 500px at 75% -8%, #141c29 0%, var(--bg) 60%) fixed;
    color:var(--fg); font-family:"Microsoft YaHei UI",system-ui,sans-serif; height:100vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header {
    height:58px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 20px;
    background:rgba(13,16,21,.82); border-bottom:1px solid var(--line); backdrop-filter:blur(10px);
  }
  .brand { display:flex; align-items:baseline; gap:8px; }
  .brand b { font-size:19px; letter-spacing:1px; }
  .brand span { color:var(--green); font-size:12px; font-weight:600; }
  .brand .dot { width:8px; height:8px; border-radius:50%; background:var(--green);
                box-shadow:0 0 8px var(--green); align-self:center; }
  #phase { padding:3px 12px; border-radius:20px; font-size:12.5px; background:var(--card2); color:var(--dim); }
  #phase.rec { background:rgba(255,107,107,.12); color:var(--red); }
  #phase.trx { background:rgba(245,196,81,.1); color:var(--amber); }
  #elapsed { font-size:20px; font-variant-numeric:tabular-nums; color:var(--fg); letter-spacing:1px; }
  #detail { color:var(--dim2); font-size:12px; }
  header .sp { flex:1; }
  .hbtn { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:10px;
          padding:7px 14px; cursor:pointer; font-size:13px; }
  .hbtn:hover { border-color:var(--blue); color:var(--blue); }
  /* ---------- 布局 ---------- */
  .wrap { flex:1; display:flex; min-height:0; }
  aside {
    width:248px; flex-shrink:0; padding:16px 12px; display:flex; flex-direction:column; gap:6px;
    background:rgba(16,19,26,.6); border-right:1px solid var(--line);
  }
  aside h2 { font-size:12px; color:var(--dim); font-weight:normal; padding:0 6px; display:flex;
             justify-content:space-between; align-items:center; }
  .seg { display:flex; background:var(--card2); border-radius:8px; padding:2px; gap:2px; }
  .seg button { flex:1; border:0; background:transparent; color:var(--dim); font-size:12px;
                padding:5px 0; border-radius:6px; cursor:pointer; }
  .seg button.on { background:var(--card3); color:var(--fg); }
  #recList { overflow-y:auto; flex:1; margin-top:4px; }
  .recItem { position:relative; padding:9px 66px 9px 12px; border-radius:9px; cursor:pointer;
             font-size:13px; margin-bottom:2px; border:1px solid transparent; }
  .recItem:hover { background:var(--card2); }
  .recItem.on { background:var(--card2); border-color:var(--line); }
  .recItem.on::before { content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px;
                        border-radius:2px; background:var(--blue); }
  .recItem small { display:block; color:var(--dim2); font-size:11px; margin-top:2px; }
  .recAct { position:absolute; right:8px; top:50%; transform:translateY(-50%); display:none; gap:8px; }
  .recItem:hover .recAct { display:flex; }
  .recAct a { cursor:pointer; font-size:11px; color:var(--dim); user-select:none; }
  .recAct a:hover { color:var(--blue); } .recAct a.del:hover { color:var(--red); }
  main { flex:1; overflow-y:auto; padding:20px 24px 30px; display:flex; flex-direction:column; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
  .card h4 { font-size:12px; color:var(--dim); font-weight:normal; margin-bottom:10px; letter-spacing:1px; }
  /* ---------- 控制卡 ---------- */
  .ctrl { display:flex; align-items:center; gap:22px; }
  #btnStart {
    width:76px; height:76px; border-radius:50%; border:0; cursor:pointer; position:relative;
    background:linear-gradient(145deg,#34d16b,#1fa952); color:#08130a; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    box-shadow:0 4px 24px rgba(34,197,94,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s;
  }
  #btnStart .ic { font-size:22px; line-height:1; } #btnStart .lb { font-size:11.5px; font-weight:600; }
  #btnStart:active { transform:scale(.94); }
  #btnStart.stop { background:linear-gradient(145deg,#ff7b7b,#e5484d); color:#fff;
                   box-shadow:0 4px 24px rgba(229,72,77,.4), inset 0 1px 0 rgba(255,255,255,.25); }
  #btnStart.stop::after {
    content:''; position:absolute; inset:-7px; border-radius:50%;
    border:2px solid rgba(255,107,107,.5); animation:pulse 1.6s ease-out infinite;
  }
  #btnStart:disabled { background:var(--card3); color:var(--dim); box-shadow:none; cursor:wait; }
  #btnStart:disabled::after { display:none; }
  @keyframes pulse { 0% { transform:scale(.9); opacity:1; } 100% { transform:scale(1.35); opacity:0; } }
  .ctrl .meta { display:flex; flex-direction:column; gap:5px; }
  #elapsed { font-size:30px; font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:2px; line-height:1; }
  #detail { color:var(--dim); font-size:12.5px; }
  .levels { margin-left:auto; display:flex; flex-direction:column; gap:10px; }
  .lv { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--dim); }
  .bar { width:130px; height:7px; background:var(--card3); border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:4px;
           background:linear-gradient(90deg,#22c55e,#4ade80); transition:width .18s; }
  /* ---------- 实时字幕剧场 ---------- */
  #liveCard { position:relative; overflow:hidden; }
  #liveCard::before { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(74,222,128,.05), transparent 40%); pointer-events:none; }
  #live { min-height:150px; max-height:300px; overflow-y:auto; font-size:16.5px; line-height:1.9;
          display:flex; flex-direction:column; gap:2px; }
  #live .final { color:var(--dim); }
  #live .final:last-child { color:var(--fg); }
  #live .final .ts { color:var(--dim2); font-size:12px; margin-right:10px; font-variant-numeric:tabular-nums; }
  #live .final .tk { color:var(--dim2); font-size:12px; margin-right:10px; }
  #partial { color:var(--green); font-size:19px; min-height:1.8em; line-height:1.9; }
  #partial::after { content:'▍'; animation:blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #progress { color:var(--amber); font-size:13px; min-height:1.4em; margin-top:8px; }
  /* ---------- 文稿 ---------- */
  .tabs { display:flex; gap:4px; background:var(--card2); border-radius:9px; padding:3px; width:max-content; }
  .tabs button { border:0; background:transparent; color:var(--dim); font-size:13px; padding:6px 16px;
                 border-radius:7px; cursor:pointer; }
  .tabs button.on { background:var(--card3); color:var(--fg); }
  #doc { line-height:2.05; font-size:15px; }
  #doc h3 { margin:16px 0 6px; color:var(--blue); font-size:15px; }
  #doc .ts { display:inline-block; color:var(--dim); background:var(--card2); border-radius:5px;
             padding:0 7px; font-size:11.5px; margin-right:9px; font-variant-numeric:tabular-nums; }
  .spkBadge { display:inline-block; font-size:11.5px; padding:0 8px; border-radius:9px; margin-right:9px; }
  .spk1 { color:#79c0ff; background:rgba(121,184,255,.13); }
  .spk2 { color:#f778ba; background:rgba(247,120,186,.13); }
  .spk3 { color:#ffa657; background:rgba(255,166,87,.13); }
  .spk4 { color:#c792ea; background:rgba(199,146,234,.13); }
  .spk5 { color:#7ee787; background:rgba(126,231,135,.13); }
  #doc hr { border:0; border-top:1px dashed var(--line); margin:18px 0; }
  #doc:empty::after { content:'从左侧选择一场录音，或开始一场新的录音'; color:var(--dim2); font-size:13.5px; }
  /* ---------- 设置 ---------- */
  details { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:4px 20px; }
  details[open] { padding-bottom:16px; }
  summary { cursor:pointer; color:var(--dim); font-size:14px; line-height:3; }
  details h5 { font-size:12.5px; color:var(--dim); margin:14px 0 6px; font-weight:normal; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 24px; }
  textarea { width:100%; height:110px; background:var(--bg); color:var(--fg); border:1px solid var(--line);
             border-radius:10px; padding:10px; font-family:inherit; font-size:13px; margin:6px 0; resize:vertical; }
  input, select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:9px;
                  padding:8px 11px; font-size:13px; width:100%; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--blue); }
  .frow { display:flex; gap:12px; margin:9px 0; align-items:center; }
  .frow label { width:76px; color:var(--dim); font-size:13px; flex-shrink:0; }
  .frow .chk { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--fg); }
  .frow .chk input { width:auto; }
  button.save { background:var(--blue); color:#0d1a26; border:0; border-radius:9px; padding:7px 18px;
                cursor:pointer; font-size:13px; }
  button.save:hover { filter:brightness(1.1); }
  button.ghost { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:9px;
                 padding:6px 16px; cursor:pointer; font-size:13px; }
  /* ---------- 弹窗/提示 ---------- */
  #qrModal { position:fixed; inset:0; background:rgba(5,7,10,.65); backdrop-filter:blur(3px); z-index:50; }
  #qrModal .panel { background:var(--card); border:1px solid var(--line); border-radius:18px;
                    max-width:430px; margin:8vh auto; padding:22px 24px; }
  .toast { position:fixed; top:70px; right:20px; background:var(--card3); border:1px solid var(--line);
           padding:10px 20px; border-radius:12px; display:none; z-index:60; font-size:13.5px;
           box-shadow:0 8px 30px rgba(0,0,0,.4); }
  /* ---------- 手机 ---------- */
  @media (max-width: 760px) {
    body { overflow:auto; height:auto; }
    header { position:sticky; top:0; z-index:10; }
    .wrap { flex-direction:column; }
    aside { width:100%; max-height:190px; border-right:0; border-bottom:1px solid var(--line); }
    main { padding:12px; }
    .levels, #detail { display:none; }
    .grid2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><b>谛听</b><span>DITING</span></div>
  <span id="phase">未录音</span>
  <span id="elapsed">00:00</span>
  <span id="detail"></span>
  <span class="sp"></span>
  <button class="hbtn" id="btnQr" onclick="openQr()">📱 手机查看</button>
</header>

<div class="wrap">
  <aside>
    <div class="seg">
      <button id="segActive" class="on" onclick="switchView(false)">录音</button>
      <button id="segArch" onclick="switchView(true)">归档夹</button>
    </div>
    <div id="recList"></div>
  </aside>

  <main>
    <div class="card ctrl">
      <button id="btnStart"><span class="ic">●</span><span class="lb">开始</span></button>
      <div class="meta">
        <div id="detail" style="margin:0;"></div>
      </div>
      <div class="levels">
        <div class="lv">系统声 <div class="bar"><i id="lv-sys"></i></div></div>
        <div class="lv">麦克风 <div class="bar"><i id="lv-mic"></i></div></div>
      </div>
    </div>

    <div class="card" id="liveCard">
      <h4>实时字幕 · LIVE</h4>
      <div id="live"></div>
      <div id="partial"></div>
      <div id="progress"></div>
    </div>

    <div class="card" id="docCard" style="display:none;">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <div class="tabs">
          <button id="tabDoc" class="on" onclick="docTab('doc')">文稿</button>
          <button id="tabMin" onclick="docTab('min')">会议纪要</button>
        </div>
        <div class="row" style="gap:8px;">
          <button class="ghost" style="padding:4px 13px;font-size:12px;" id="btnSrt">导出 SRT</button>
          <button class="ghost" style="padding:4px 13px;font-size:12px;" id="btnDocx">导出 Word</button>
        </div>
      </div>
      <div id="doc"></div>
      <div id="docMin" style="display:none;"></div>
    </div>

    <details>
      <summary>⚙️ 设置 · 热词 / 纪要接口 / 安全</summary>
      <div class="grid2">
        <div>
          <h5>热词表 —— 一行一个，# 注释。专有名词、人名、产品名</h5>
          <textarea id="hotwords"></textarea>
          <button class="save" onclick="saveHotwords()">保存热词</button>
        </div>
        <div>
          <h5>纪要接口（OpenAI 兼容 / Anthropic；api_base 留空 = 模拟模式）</h5>
          <div class="frow"><label>api_base</label><input id="cfg-base" placeholder="https://xx/v1"></div>
          <div class="frow"><label>api_key</label><input id="cfg-key" type="password" placeholder="留空则不修改"></div>
          <div class="frow"><label>model</label><input id="cfg-model" placeholder="qwen-plus"></div>
          <div class="frow"><label>接口格式</label>
            <select id="cfg-format">
              <option value="openai">OpenAI (/chat/completions)</option>
              <option value="anthropic">Anthropic (/v1/messages)</option>
            </select>
          </div>
          <button class="save" onclick="saveConfig()">保存接口配置</button>
          <h5>信任栅栏 —— 写操作永远仅限本机/白名单</h5>
          <div class="frow"><label>局域网</label>
            <label class="chk"><input type="checkbox" id="cfg-lan"> 允许局域网设备查看字幕与文稿</label>
          </div>
          <div class="frow"><label>白名单</label><input id="cfg-admin" placeholder="额外可写操作的内网 IP，逗号分隔"></div>
          <button class="save" onclick="saveFence()">保存安全设置</button>
        </div>
      </div>
    </details>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="qrModal" style="display:none;" onclick="closeQr(event)">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <b>📱 手机扫码查看</b>
      <a href="javascript:closeQr()" style="color:var(--dim);text-decoration:none;font-size:18px;">✕</a>
    </div>
    <div id="qrStatus" style="color:var(--dim);font-size:13px;margin:6px 0;">加载中…</div>
    <div id="qrBox" style="background:#fff;border-radius:14px;padding:10px;width:244px;margin:10px auto;text-align:center;">
      <img id="qrImg" alt="二维码" style="width:224px;height:224px;display:block;">
    </div>
    <div id="qrUrl" style="font-size:14px;color:var(--blue);text-align:center;word-break:break-all;margin:8px 0 12px;"></div>
    <div class="row" style="justify-content:center;gap:10px;">
      <button class="save" onclick="refreshQr()">刷新二维码</button>
      <button class="ghost" onclick="copyLink()">复制链接</button>
    </div>
    <div id="qrLan" style="margin-top:14px;font-size:12.5px;color:var(--dim);"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let phase = 'idle', ws, timer, archView = false;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2500); }
function fmt(s){ s=Math.floor(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function setPhase(p, detail, elapsed){
  phase = p;
  const b = $('phase');
  b.className = (p==='recording'?'rec':p==='transcribing'||p==='loading'?'trx':'');
  b.id = 'phase';
  b.textContent = {idle:'未录音', loading:'准备中', recording:'录音中', transcribing:'精转中'}[p] || p;
  const btn = $('btnStart');
  btn.innerHTML = (p==='recording')
    ? '<span class="ic">■</span><span class="lb">停止</span>'
    : '<span class="ic">●</span><span class="lb">开始</span>';
  btn.classList.toggle('stop', p==='recording');
  btn.disabled = (p==='loading'||p==='transcribing');
  $('detail').textContent = detail || '';
  $('detail').style.display = detail ? '' : 'none';
  const el = $('elapsed');
  clearInterval(timer);
  if (p==='recording') { el.style.display='';
    el.textContent = fmt(elapsed||0);
    let base = elapsed||0, t0 = Date.now();
    timer = setInterval(()=> el.textContent = fmt(base + (Date.now()-t0)/1000), 500);
  } else { el.style.display='none'; }
  if (p==='idle') { $('lv-sys').style.width = 0; $('lv-mic').style.width = 0; }
}

function addFinal(track, ts, text){
  const div = document.createElement('div'); div.className='final';
  div.innerHTML = `<span class="ts">${ts}</span><span class="tk">${track}</span>${text}`;
  const live = $('live'); live.appendChild(div);
  while (live.children.length > 60) live.firstChild.remove();
  live.scrollTop = live.scrollHeight;
}

function switchView(arch){
  archView = arch;
  $('segActive').classList.toggle('on', !arch);
  $('segArch').classList.toggle('on', arch);
  loadRecordings();
}

function loadRecordings(){
  fetch('/api/recordings'+(archView ? '?view=archive' : '')).then(r=>r.json()).then(list=>{
    const rl = $('recList'); rl.innerHTML = '';
    if (!list.length) {
      rl.innerHTML = `<div style="color:var(--dim2);font-size:12px;padding:8px 12px;">${archView?'归档夹为空':'暂无录音'}</div>`;
      return;
    }
    list.forEach(r=>{
      const d = document.createElement('div');
      d.className='recItem'; d.innerHTML = `${r.name}<small>${r.mtime}</small>`;
      const act = document.createElement('span'); act.className='recAct';
      const bArc = document.createElement('a');
      bArc.textContent = archView ? '还原' : '归档';
      bArc.onclick = e=>{ e.stopPropagation(); doArchive(r.name, !archView); };
      const bDel = document.createElement('a'); bDel.className='del'; bDel.textContent = '删除';
      bDel.onclick = e=>{ e.stopPropagation(); doDelete(r); };
      act.append(bArc, bDel); d.appendChild(act);
      d.onclick = ()=>{ document.querySelectorAll('.recItem').forEach(x=>x.classList.remove('on'));
        d.classList.add('on'); loadTranscript(r.md, r.name); };
      rl.appendChild(d);
    });
  });
}

function doArchive(name, toArchive){
  fetch('/api/archive',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name, undo:!toArchive})}).then(r=>r.json()).then(d=>{
    if (d.ok) { toast(toArchive ? '已归档' : '已还原'); loadRecordings(); }
    else toast('失败: '+(d.error||'')); });
}
function doDelete(r){
  if (!confirm(`永久删除 ${r.name} 的录音与文稿？不可恢复`)) return;
  fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:r.name})}).then(x=>x.json()).then(d=>{
    if (d.ok) { toast('已删除');
      if (curMdFile && curMdFile.startsWith(r.name)) $('docCard').style.display='none';
      loadRecordings(); }
    else toast('失败: '+(d.error||'')); });
}

const SPK_COLORS = 5;
function spkBadge(tag){
  const n = parseInt((tag.match(/(\d+)/)||[0,1])[1], 10);
  return `<span class="spkBadge spk${((n-1) % SPK_COLORS) + 1}">${tag}</span>`;
}

let docParts = {doc:'', min:''};
function renderMd(md){
  docParts = {doc:[], min:[]};
  let inMinutes = false;
  md.split('\n').forEach(line=>{
    const l = line.trim();
    if (l.startsWith('# 会议纪要')) { inMinutes = true; docParts.min.push('<hr>');
      docParts.min.push('<h3>会议纪要</h3>'); return; }
    if (l.startsWith('## ')) {
      const h = `<h3>${l.slice(3)}</h3>`;
      (inMinutes ? docParts.min : docParts.doc).push(h); return;
    }
    if (l.startsWith('# ') || !l) return;
    if (l.startsWith('---')) { (inMinutes ? docParts.min : docParts.doc).push('<hr>'); return; }
    const p = document.createElement('div');
    const m = l.match(/^\[(\d{2}:\d{2})\](\[(说话人\d+)\])?\s*(.*)$/);
    let html = null;
    if (m && !inMinutes) {
      const spk = m[3] ? spkBadge(m[3]) : '';
      html = `<span class="ts">${m[1]}</span>${spk}${m[4]}`;
    }
    (inMinutes ? docParts.min : docParts.doc).push(html !== null ? `<div>${html}</div>` : `<div>${l}</div>`);
  });
  $('doc').innerHTML = docParts.doc.join('') || '<div style="color:var(--dim2)">（无转写内容）</div>';
  $('docMin').innerHTML = docParts.min.join('') || '<div style="color:var(--dim2)">（尚未生成纪要）</div>';
  docTab(hasMin() ? 'min' : 'doc');
  $('docCard').style.display = 'block';
}
function hasMin(){ return docParts.min.some(x => x !== '<hr>' && !x.startsWith('<h3>')); }
function docTab(which){
  $('tabDoc').classList.toggle('on', which==='doc');
  $('tabMin').classList.toggle('on', which==='min');
  $('doc').style.display = which==='doc' ? '' : 'none';
  $('docMin').style.display = which==='min' ? '' : 'none';
}

let curMdFile = null;
function setCurrentDoc(file, name){
  curMdFile = file;
  $('docCard').style.display = 'block';
}
function loadTranscript(file, name){
  fetch('/api/transcript?name='+encodeURIComponent(file)).then(r=>r.json())
    .then(d=>{ setCurrentDoc(file, name); renderMd(d.md); });
}
$('btnSrt').onclick = ()=> curMdFile && window.open('/api/export?name='+encodeURIComponent(curMdFile)+'&fmt=srt');
$('btnDocx').onclick = ()=> curMdFile && window.open('/api/export?name='+encodeURIComponent(curMdFile)+'&fmt=docx');

function saveHotwords(){
  fetch('/api/hotwords',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:$('hotwords').value})}).then(()=>toast('热词已保存'));
}
function saveConfig(){
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({api_base:$('cfg-base').value, api_key:$('cfg-key').value,
      model:$('cfg-model').value, api_format:$('cfg-format').value})})
    .then(()=>toast('接口配置已保存'));
}
let qrTimer = null;
function openQr(){
  $('qrModal').style.display = 'block';
  refreshQr();
  qrTimer = setInterval(pollLan, 3000);
  pollLan();
}
function closeQr(e){
  if (e && e.target && e.target.id !== 'qrModal' && e.target.textContent !== '✕') return;
  $('qrModal').style.display = 'none';
  clearInterval(qrTimer);
}
function refreshQr(){
  $('qrImg').src = '/api/qr.svg?t=' + Date.now();
  pollLan();
}
function copyLink(){
  const url = $('qrUrl').textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(()=>toast('链接已复制')).catch(()=>{});
}
function pollLan(){
  fetch('/api/qr-info').then(r=>r.json()).then(d=>{
    $('qrUrl').textContent = d.url || '';
    if (!d.lan_on) {
      $('qrStatus').innerHTML = '局域网访问未开启';
      $('qrLan').innerHTML = '<button class="save" onclick="enableLan()">一键开启局域网并重启服务</button>' +
        '<div style="margin-top:6px;color:var(--dim);">开启后手机连同一 WiFi 即可访问；写操作仍仅限本机。</div>';
      $('qrBox').style.opacity = .25;
      return;
    }
    $('qrBox').style.opacity = 1;
    $('qrStatus').innerHTML = d.phone.fresh
      ? '<span style="color:var(--green);">● 手机已连接</span>（' + (d.phone.ip||'') + '）'
      : '等待手机连接… 用手机相机扫码，或在手机浏览器打开下方链接。';
    $('qrLan').textContent = '局域网访问已开启（' + (d.ips||[]).join(' / ') + '）· 写操作仅限本机/白名单';
  });
}
function enableLan(){
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lan_access:true})}).then(()=>{
    toast('正在重启服务…');
    fetch('/api/restart',{method:'POST'}).then(()=>{
      $('qrStatus').textContent = '服务重启中，几秒后自动恢复…';
      const wait = setInterval(()=>{
        fetch('/api/status').then(r=>{ if(r.ok){ clearInterval(wait); location.reload(); } }).catch(()=>{});
      }, 1500);
    });
  });
}

function saveFence(){
  const admins = $('cfg-admin').value.split(/[,，\s]+/).filter(x=>x);
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lan_access:$('cfg-lan').checked, admin_hosts:admins})})
    .then(()=>toast('已保存。局域网开关需重启服务生效'));
}

$('btnStart').onclick = ()=>{
  if (phase==='recording') {
    fetch('/api/stop',{method:'POST'});
  } else if (phase==='idle') {
    $('live').innerHTML=''; $('partial').textContent=''; $('progress').textContent='';
    fetch('/api/start',{method:'POST'}).then(r=>r.json()).then(d=>{
      if(!d.ok) toast('启动失败: '+d.error);
    });
  }
};

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ev=>{
    const m = JSON.parse(ev.data);
    if (m.type==='status') setPhase(m.phase, m.detail, m.elapsed);
    else if (m.type==='partial') $('partial').textContent = m.text ? `▶ ${m.track}｜${m.text}` : '';
    else if (m.type==='final') { $('partial').textContent=''; addFinal(m.track, m.ts, m.text); }
    else if (m.type==='level') { $('lv-sys').style.width = (m['系统']||0)*100+'%';
                                 $('lv-mic').style.width = (m['麦克风']||0)*100+'%'; }
    else if (m.type==='progress') $('progress').textContent = m.msg;
    else if (m.type==='transcript') { $('progress').textContent=''; setCurrentDoc(m.name, m.name);
                                      renderMd(m.md); }
    else if (m.type==='recordings') loadRecordings();
  };
  ws.onclose = ()=> setTimeout(connect, 1500);
}

fetch('/api/status').then(r=>r.json()).then(s=> setPhase(s.phase, s.detail, s.elapsed));
fetch('/api/hotwords').then(r=>r.json()).then(d=> $('hotwords').value = d.text||'');
fetch('/api/config').then(r=>r.json()).then(d=>{ $('cfg-base').value=d.api_base||'';
  $('cfg-model').value=d.model||''; $('cfg-format').value=d.api_format||'openai';
  $('cfg-lan').checked = !!d.lan_access; $('cfg-admin').value=(d.admin_hosts||[]).join(',');
  $('cfg-key').placeholder=d.api_key?'已设置(留空不修改)':'留空则不修改'; });
loadRecordings();
connect();
</script>
</body>
</html>
